android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g

# Config do app da maquininha — os valores REAIS vão em secrets.properties
# (gitignorado; ver secrets.properties.example). Estas chaves existem só como
# fallback vazio pra linha de comando (-P).
# Servidor default do app (Prainha Bar; o app permite trocar na tela de login)
API_BASE=http://10.0.0.252:8790
# Concilia na nuvem — SÓ pra buscar as filiais pelo código da empresa. Não
# apontar pra IP de loja: fora daquela rede o "Buscar" morre em timeout.
CONCILIA_BASE=https://app.prainhabar.com

# Credenciais do Order Manager SDK (Dev Console Cielo -> app Concilia/Prainha).
# Obrigatórias pro pagamento NO terminal (sem elas o botão de cobrar some).
CIELO_CLIENT_ID=
CIELO_ACCESS_TOKEN=
